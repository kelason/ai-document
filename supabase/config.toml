project_id = "ai-docs-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "https://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.confirmation]
subject = "Confirm your AI Docs email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your AI Docs password"
content_path = "./supabase/templates/recovery.html"

# Generous limits only for the disposable, loopback development stack.
[auth.rate_limit]
email_sent = 1000
token_verifications = 1000
sign_in_sign_ups = 1000
